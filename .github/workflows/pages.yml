name: deploy
# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: picks up tracks added from the staff page
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build
        env:
          SUPABASE_URL: https://hxfuelulxsituzcgsvhg.supabase.co
          SITE_URL: https://subduction.art
          TURNSTILE_SITE_KEY: 0x4AAAAAAFZadT27taMa0fvL
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: subduction.art
          force_orphan: true
