name: keep-alive
# Supabase pauses free projects after a week of silence. One request a day keeps it awake.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://hxfuelulxsituzcgsvhg.supabase.co/functions/v1/health"
