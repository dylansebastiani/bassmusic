name: deploy-functions
# one-time branch: deploys artist + playlist only
# Deploys the backend (Supabase Edge Functions) straight from this repo, so what's live always matches
# what's committed. Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard > Account > Access Tokens).
#
# T.O.F.T.U.'s functions (and artist + playlist, which serve its artist passes and uploads) are left OUT of the list below on purpose, so nothing here can touch the first show's
# checkout, tickets, door or payments. Deploy those by hand, deliberately, only when Dylan says so.
# Fan-wide functions (signup, emails, collection) also reach T.O.F.T.U.'s buyers, so they're held back too.
#   held back: tickets, stripe-webhook, door, checkin, subscribe, confirm, verify, me, unsubscribe, engage,
#              profile, email-runner, email-webhook, collection, track, meta, admin, pageview, health
on:
  push:
    branches: [deploy-members-once]
    paths: ["supabase/functions/**", ".github/workflows/functions.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Deploy just these (space-separated names). Leave empty for the whole safe list. Held-back names deploy only when listed here on purpose."
        required: false
concurrency:
  group: functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: hxfuelulxsituzcgsvhg
      SAFE: >-
        artist playlist
    steps:
      - uses: actions/checkout@v4
      - name: Stop if the token isn't set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Add the SUPABASE_ACCESS_TOKEN secret first."; exit 1; fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        run: |
          LIST="${{ github.event.inputs.only }}"
          [ -z "$LIST" ] && LIST="$SAFE"
          for f in $LIST; do
            # On a push only the safe list deploys. A held-back function deploys only when named on purpose (manual run).
            if [ -z "${{ github.event.inputs.only }}" ]; then case " $SAFE " in *" $f "*) ;; *) echo "Skipping $f: not on the safe list"; continue;; esac; fi
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT" --no-verify-jwt --use-api --yes
            echo "::endgroup::"
          done
