<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="/assets/chrome.css">
<style>.done{padding:24px 0 64px}.done h1 em{font-style:normal;color:var(--hot)}.done p{color:var(--mute);font-size:17px;line-height:1.6;margin:10px 0 0}.done p a{color:var(--fg)}</style>
<!--CONFIG-->
<title>Unsubscribed</title>
</head>
<body>
<!--SITE-NAV:bleed-->
<main class="wrap done">
  <h1 class="disp" id="h">You're <em>unsubscribed.</em></h1>
  <p id="p">We won't email you again.</p>
</main>
<!--SITE-FOOT:bleed-->
<script>
// ?ok=0 means the link didn't match or the block failed on our side.
if (new URLSearchParams(location.search).get("ok") === "0") {
  document.getElementById("h").innerHTML = "Link not <em>recognised.</em>";
  document.getElementById("p").innerHTML = 'That link didn\'t match anyone, or something went wrong on our side. Email <a href="mailto:hello@subduction.art">hello@subduction.art</a> and we\'ll take you off the list.';
}
</script>
</body>
</html>
