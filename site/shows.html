<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Midwest bass shows</title>
<meta name="description" content="Upcoming bass shows across the Midwest, by city and date.">
<link rel="canonical" href="https://subduction.art/shows">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Subduction">
<meta property="og:title" content="Midwest bass shows">
<meta property="og:description" content="Upcoming bass shows across the Midwest, by city and date.">
<meta property="og:url" content="https://subduction.art/shows">
<meta property="og:image" content="https://subduction.art/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Midwest bass shows">
<meta name="twitter:description" content="Upcoming bass shows across the Midwest, by city and date.">
<meta name="twitter:image" content="https://subduction.art/assets/og.jpg">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/shows.css">
<!--CONFIG-->
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="bar">
  <a class="brand" href="/" aria-label="Subduction home"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 44h48v10H8zM12 28h40v10H12zM16 12h32v10H16z"/></svg><b>Subduction</b></a>
</header>
<main class="wrap">
  <p class="kick" id="kick">Midwest</p>
  <h1 class="disp" id="title">Bass <em>shows.</em></h1>
  <span class="laser" aria-hidden="true"></span>
  <p class="lead">Bass shows across the Midwest. Tickets here, or on the promoter's own link.</p>

  <div id="featured"></div>

  <form class="filters" id="filters" role="search">
    <nav class="cities" id="cities" aria-label="Cities"><a class="chip on" href="/shows">All cities</a></nav>
    <div class="fbar">
      <div class="wide">
        <label for="q">Search</label>
        <input id="q" type="search" autocomplete="off" placeholder="Show or city">
      </div>
      <div>
        <label for="when">Date</label>
        <select id="when">
          <option value="all">All upcoming</option>
          <option value="weekend">This weekend</option>
          <option value="month">This month</option>
          <option value="pick">Pick a date</option>
        </select>
      </div>
      <div id="onbox" hidden>
        <label for="on">Day</label>
        <input id="on" type="date">
      </div>
    </div>
  </form>

  <div id="list" class="wall"><p class="loading">Loading.</p><!--LIST--></div>

  <section class="send" id="add">
    <div class="send-copy">
      <p class="kick">Your show</p>
      <h2 class="disp">Send it <em>in.</em></h2>
      <p class="lead">Paste a ticket link or add a flyer. It goes up after a look.</p>
      <a class="btn" href="/shows-send" id="opensend">Send it in</a>
    </div>
  </section>
</main>
<footer class="foot">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 44h48v10H8zM12 28h40v10H12zM16 12h32v10H16z"/></svg><b>Subduction</b></a>
  <nav class="flinks"><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/promoter">Sell tickets</a></nav>
</footer>
<script src="/assets/stack.js" defer></script>
<script src="/assets/fees.js" defer></script>
<script src="/assets/shows.js" defer></script>
</body>
</html>
