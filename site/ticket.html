<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch.png">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/tix.css">
<!--CONFIG-->
<title>Your ticket</title>
</head>
<body>
<main class="wrap tix">
  <p class="msg" id="msg" role="status">Loading your ticket...</p>
  <div id="tk" hidden>
    <div class="mono" id="kind">Ticket</div>
    <h1 class="disp" id="ename"></h1>
    <p class="where2" id="ewhere"></p>
    <div class="ticket" id="card">
      <div class="hd"><h2 id="ttype"></h2><div class="mono" id="tname"></div></div>
      <div class="qrbox"><img id="qr" alt="Ticket QR code" width="300" height="300"></div>
      <div class="cd" id="tcode"></div>
      <div id="rows"></div>
    </div>
    <p class="fineprint">Show this QR code at the door. It works once per night. Screenshot it in case the venue has no signal, but don't share it: the first scan wins.</p>
  </div>
</main>
<script src="assets/ticket.js"></script>
</body>
</html>
