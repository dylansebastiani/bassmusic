<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://hxfuelulxsituzcgsvhg.supabase.co https://*.stripe.com; connect-src 'self' https://hxfuelulxsituzcgsvhg.supabase.co https://api.stripe.com https://*.stripe.com https://*.stripe.network; frame-src https://js.stripe.com https://*.stripe.com https://*.stripe.network; media-src 'self' blob: https://hxfuelulxsituzcgsvhg.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch.png">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preload" href="assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/tix.css">
<style>
body.pro-ticket{background:#000;color:#f4f1ee}
body.pro-ticket .byline{font-family:"Space Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#b6ff00;margin:0}
body.pro-ticket h1.show-name{font-family:"Anton","Arial Narrow",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(36px,10vw,56px);line-height:.95;color:#f4f1ee;margin:8px 0 0}
</style>
<!--CONFIG-->
<title>Your ticket</title>
</head>
<body class="toftu">
<main class="wrap tix toftu">
  <div class="brand"><img class="wm" src="assets/toftu/wordmark.webp" alt="T.O.F.T.U." width="1400" height="373" style="width:min(60%,260px)"></div>
  <p class="msg" id="msg" role="status">Loading your ticket...</p>
  <div id="tk" hidden>
    <div class="mono" id="kind">Ticket</div>
    <h1 class="ftu-img" style="margin-top:8px"><img src="assets/toftu/ftu.webp" alt="" width="1736" height="112"><span class="sr" id="ename"></span></h1>
    <p class="where2" id="ewhere"></p>
    <div class="ticket" id="card">
      <div class="hd"><h2 id="ttype"></h2><div class="mono" id="tname"></div></div>
      <div class="qrbox"><img id="qr" alt="Ticket QR code" width="300" height="300"></div>
      <div class="cd" id="tcode"></div>
      <div id="rows"></div>
    </div>
    <a class="btn" id="pdf" href="#" target="_blank" rel="noopener" style="margin-top:16px">Download PDF ticket</a>
    <p class="fineprint">Show this QR code at the door. It works once per night. Screenshot it in case the venue has no signal, but don't share it: the first scan wins.</p>
  </div>
</main>
<script src="assets/ticket.js"></script>
</body>
</html>
