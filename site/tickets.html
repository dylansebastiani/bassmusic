<title>T.O.F.T.U. · For The Underground · Tickets</title>

<body class="toftu">
<main class="wrap tix toftu" id="page">
  <p class="msg" id="loading" role="status">Loading...</p>

  <div id="ev" hidden>
    <div class="brand"><img class="wm" src="assets/toftu/wordmark.webp" alt="T.O.F.T.U." width="1400" height="373">
      <h1 class="ftu-img"><img src="assets/toftu/ftu.webp" alt="" width="1736" height="112"><span class="sr" id="name">This one is for the underground</span></h1></div>
    <div class="hero"><img src="assets/toftu/hero.webp" alt="" width="1200" height="670"></div>
    <img class="poster" id="poster" alt="" hidden>
    <p class="where2" id="where"></p>
    <div class="meta" id="meta"></div>
    <div class="flyers">
      <a href="assets/toftu/poster-fri.webp" target="_blank" rel="noopener"><img src="assets/toftu/poster-fri-sm.webp" alt="Fri Jan 8 flyer: Treegaud b2b Waylo, Badguy Moolah, DEWEY, B3RMVDA, EKIM, GEEZ" width="480" height="600" loading="lazy"></a>
      <a href="assets/toftu/poster-sat.webp" target="_blank" rel="noopener"><img src="assets/toftu/poster-sat-sm.webp" alt="Sat Jan 9 flyer: PATCHES, Cache Stack, Synth Sirena, Neuroversal, Dr. Lee, Garfunkel" width="480" height="600" loading="lazy"></a>
    </div>
    <div class="nights" id="nights"></div>

    <div id="done" hidden></div>

    <section id="shop">
      <h2 class="sec">Tickets</h2>
      <div class="types" id="types"></div>
      <form class="buy" id="buy" novalidate>
        <div class="total"><span class="mono">Total <small id="feeNote" style="text-transform:none;letter-spacing:0"></small></span><b id="total">$0</b></div>
        <label for="bname">Name</label><input type="text" id="bname" autocomplete="name" maxlength="80">
        <label for="bemail">Email (your tickets go here)</label><input type="email" id="bemail" autocomplete="email" inputmode="email" maxlength="254">
        <details class="promo" id="promoBox"><summary>Have a code?</summary>
          <label for="bpromo">Code</label><input type="text" id="bpromo" autocomplete="off" maxlength="30">
        </details>
        <button type="submit" class="btn" id="go">Checkout</button>
        <p class="msg" id="bmsg" role="status"></p>
        <p class="fineprint">21+ with ID. Ticket prices plus a small card processing fee, shown before you pay. Tickets are emailed right away with a QR code for the door. All sales final unless the show is cancelled.</p>
      </form>
      <div id="payWrap" hidden>
        <button type="button" class="back" id="back">&larr; Change tickets</button>
        <div id="checkout"></div>
      </div>
    </section>
    <img class="partners" src="assets/toftu/partners.png" alt="Event partners">
  </div>
</main>
<script src="assets/stack.js"></script>
<script src="assets/tickets.js"></script>
</body>
</html>
