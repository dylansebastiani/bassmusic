<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Stack</title>
<meta name="description" content="Free unreleased music, guest list drawings and first access to every drop. Members only.">
<meta property="og:title" content="The Stack">
<meta property="og:description" content="Hear it before the internet does.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<!--CONFIG-->
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main class="hero">
  <div class="brand" id="brand"></div>
  <h1 id="h1"></h1>
  <p class="lead" id="sub"></p>

  <form id="f" novalidate method="post" action="/in">
    <label for="email" class="sr">Email address</label>
    <div class="unit">
      <input type="email" id="email" name="email" placeholder="your email" autocomplete="email" inputmode="email" required autocapitalize="off" spellcheck="false">
      <button type="submit" class="btn" id="btn"></button>
    </div>
    <div id="hint" class="msg" hidden><button type="button" class="hint" id="hintBtn"></button></div>
    <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="ts"></div>
    <p class="micro" id="micro"></p>
  </form>
  <div id="msg" class="msg" role="status"></div>
  <div class="proof" id="proof" hidden></div>

  <p class="perkline" id="perks"></p>
  <footer>
    <a href="/privacy">Privacy</a>
    <a href="/rules">Rules</a>
    <a id="contact" href="#">Contact</a>
  </footer>
</main>
<script src="/app.js"></script>
<script>
(function () {
  var S = window.Stack, C = S.C, $ = function (id) { return document.getElementById(id); };
  var v = S.variant();
  var labelName = C.labelName || "";
  $("brand").textContent = (labelName ? labelName + " · " : "") + (C.membershipName || "The Stack");
  function glitch(t) { return t.split(" ").map(function (w) { return '<span class="g" data-text="' + S.esc(w) + '">' + S.esc(w) + "</span>"; }).join(" "); }
  // When event mode swaps the headline after load, decode it again.
  var _h1set = function (html) { $("h1").innerHTML = html; if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { decode($("h1")); }); };
  $("h1").innerHTML = glitch((C.headlines || {})[v] || "Hear it before the internet does.");
  $("sub").textContent = C.subhead || "";
  $("btn").textContent = C.cta || "LET ME IN";
  $("micro").textContent = C.microcopy || "";
  $("contact").href = "mailto:" + (C.contactEmail || "");
  $("perks").innerHTML = (C.perks || []).map(function (p) { return "<span>" + S.esc(p.title) + "</span>"; }).join('<i aria-hidden="true">&middot;</i>');

  // Event mode + real member count (shown only past the threshold, never faked).
  S.get("meta", { e: S.attr.e || null }).then(function (m) {
    if (m.event) {
      _h1set(glitch(S.fill(C.eventHeadline, { EVENT_NAME: m.event.name })));
      $("sub").textContent = S.fill(C.eventSubhead, { PRIZE: m.event.prize || "the giveaway", EVENT_NAME: m.event.name });
    }
    if (m.count && m.count >= (C.socialProofMin || 100)) { $("proof").textContent = m.count.toLocaleString() + " already inside"; $("proof").hidden = false; }
  }).catch(function () {});
  S.pageview("/");

  // Typo fixer: "Did you mean gmail.com?"
  var FIX = { "gmial.com": "gmail.com", "gmal.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com", "gnail.com": "gmail.com", "hotmial.com": "hotmail.com", "hotmal.com": "hotmail.com", "yaho.com": "yahoo.com", "yahooo.com": "yahoo.com", "outlok.com": "outlook.com", "iclod.com": "icloud.com", "icoud.com": "icloud.com" };
  function suggest(email) {
    var at = email.lastIndexOf("@"); if (at < 0) return null;
    var dom = email.slice(at + 1).toLowerCase(), fixed = FIX[dom];
    if (!fixed && /\.(con|cmo|ocm|vom|cm)$/.test(dom)) fixed = dom.replace(/\.(con|cmo|ocm|vom|cm)$/, ".com");
    return fixed && fixed !== dom ? email.slice(0, at + 1) + fixed : null;
  }
  var pendingSuggest = null;
  $("hintBtn").addEventListener("click", function () { $("email").value = pendingSuggest; $("hint").hidden = true; pendingSuggest = null; });

  // Turnstile loads lazily, only once someone touches the form.
  var tsReady = null, tsToken = null;
  function loadTurnstile() {
    if (tsReady || !C.turnstileSiteKey) return;
    tsReady = new Promise(function (res) {
      window.__tsOnload = function () {
        turnstile.render("#ts", { sitekey: C.turnstileSiteKey, size: "invisible", callback: function (tok) { tsToken = tok; }, "error-callback": function () { tsToken = null; } });
        res();
      };
      var s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__tsOnload&render=explicit"; s.async = true; document.head.appendChild(s);
    });
  }
  $("email").addEventListener("focus", loadTurnstile, { once: true });

  function say(t, ok) { $("msg").textContent = t; $("msg").className = "msg" + (ok ? " ok" : ""); }
  function go(res) { location.href = "/in?t=" + encodeURIComponent(res.access_token) + (res.already_member ? "&back=1" : "") + (res.event ? "&e=" + encodeURIComponent(res.event.slug) : ""); }

  function submit(emailEl, btnEl) {
    var email = emailEl.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) { say("That email doesn't look right."); emailEl.focus(); return; }
    var sug = suggest(email);
    if (sug && pendingSuggest !== sug) { pendingSuggest = sug; $("hintBtn").textContent = "Did you mean " + sug + "?"; $("hint").hidden = false; say(""); return; }
    $("hint").hidden = true;
    btnEl.disabled = true; say("One sec...");
    var body = { email: email, hp: $("website").value, variant: v, src: S.attr.src || null, e: S.attr.e || null, r: S.attr.r || null,
      utm_source: S.attr.utm_source || null, utm_medium: S.attr.utm_medium || null, utm_campaign: S.attr.utm_campaign || null, turnstile: null };
    var ready = tsReady ? Promise.race([tsReady, new Promise(function (r) { setTimeout(r, 4000); })]) : Promise.resolve();
    ready.then(function () { body.turnstile = tsToken; return S.api("subscribe", body); })
      .then(go)
      .catch(function (err) {
        if (err.status === 429) { say("Slow down a sec and try again."); btnEl.disabled = false; return; }
        if (err.status && err.status < 500) { say(err.message || "Couldn't sign you up."); btnEl.disabled = false; return; }
        // Network died (festival wifi). Keep the signup, show success, retry later.
        S.savePending(body);
        location.href = "/in?pending=1";
      });
  }
  $("f").addEventListener("submit", function (e) { e.preventDefault(); submit($("email"), $("btn")); });
  if (navigator.onLine) S.flushPending().catch(function () {});

  // ---------- Background: WebGL signal. Smoke, tearing scanlines, RGB split that bends toward the pointer. ----------
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function startBg() {
    var cv = $("bg"), gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
    if (!gl) { cv.style.background = "radial-gradient(ellipse at 50% 40%, #141414, #000 70%)"; return; }
    var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    var FS = [
      "precision mediump float;uniform vec2 R;uniform float T;uniform vec2 M;uniform float I;",
      "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
      "float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}",
      "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}",
      "float smoke(vec2 uv,float t){vec2 q=vec2(fbm(uv*1.6+t*.05),fbm(uv*1.6-t*.04+3.1));return fbm(uv*2.2+q*1.8+t*.03);}",
      "void main(){",
      " vec2 uv=gl_FragCoord.xy/R; vec2 asp=vec2(R.x/R.y,1.);",
      " float t=T*.001;",
      " // tearing rows: a few random bands per second shove the image sideways",
      " float row=floor(uv.y*R.y/3.);float seed=floor(t*9.);",
      " float tear=step(.985,h(vec2(row*.013,seed)))*(h(vec2(seed,row))-.5)*.25;",
      " float big=step(.93,h(vec2(seed*.37,floor(uv.y*7.))))*step(.6,h(vec2(seed)))*(h(vec2(seed*1.3,floor(uv.y*7.)))-.5)*.12;",
      " uv.x+=(tear+big)*I;",
      " // pointer lens: bend space toward the finger",
      " vec2 d=(uv-M)*asp;float r=length(d);float lens=smoothstep(.45,0.,r)*.08;uv-=normalize(d+1e-4)*lens*(1.-r);",
      " // rgb split grows with tear strength and near the pointer",
      " float sp=(.0025+abs(tear)*.6+lens*.9)*I;",
      " float sr=smoke((uv+vec2(sp,0.))*asp,t),sg=smoke(uv*asp,t),sb=smoke((uv-vec2(sp,0.))*asp,t);",
      " vec3 c=vec3(sr,sg,sb);",
      " c=pow(c,vec3(2.6))*1.15; // crush to black with bright veins",
      " // a slow vertical beam sweeping like a stage light through haze",
      " float bx=fract(t*.045)*1.4-.2;float beam=exp(-pow((uv.x-bx)*9.,2.))*.09;c+=beam*vec3(1.,.96,.9)*(.5+sg);",
      " // horizon line that glitches",
      " float ln=exp(-abs(uv.y-.5-tear*2.)*220.)*.25*step(.5,h(vec2(seed*.11)));c+=ln*vec3(1.,.3,.5);",
      " // scanlines + grain + vignette",
      " c*=.86+.14*sin(gl_FragCoord.y*3.1416);",
      " c+=(h(gl_FragCoord.xy+t)-.5)*.06;",
      " float vg=smoothstep(1.25,.25,length((uv-.5)*vec2(1.1,1.4)));c*=vg;",
      " gl_FragColor=vec4(c,1.);}"
    ].join("\n");
    function sh(type, src) { var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; }
    var prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { cv.style.background = "radial-gradient(ellipse at 50% 40%, #141414, #000 70%)"; return; }
    gl.useProgram(prog);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uR = gl.getUniformLocation(prog, "R"), uT = gl.getUniformLocation(prog, "T"), uM = gl.getUniformLocation(prog, "M"), uI = gl.getUniformLocation(prog, "I");
    var mx = 0.5, my = 0.5, tx = 0.5, ty = 0.5, run = true, scale = 0.5;
    function size() { cv.width = Math.floor(innerWidth * scale); cv.height = Math.floor(innerHeight * scale); gl.viewport(0, 0, cv.width, cv.height); }
    function onMove(x, y) { tx = x / innerWidth; ty = 1 - y / innerHeight; }
    addEventListener("mousemove", function (e) { onMove(e.clientX, e.clientY); }, { passive: true });
    addEventListener("touchmove", function (e) { if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    addEventListener("touchstart", function (e) { if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    size(); addEventListener("resize", size);
    document.addEventListener("visibilitychange", function () { run = !document.hidden; });
    var t0 = performance.now();
    function frame(now) {
      if (run) {
        mx += (tx - mx) * 0.08; my += (ty - my) * 0.08;
        gl.uniform2f(uR, cv.width, cv.height); gl.uniform1f(uT, now); gl.uniform2f(uM, mx, my);
        gl.uniform1f(uI, still ? 0.0 : Math.min(1, (now - t0) / 1200)); // tears fade in after the page has settled
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  if (window.requestIdleCallback) requestIdleCallback(startBg, { timeout: 800 }); else setTimeout(startBg, 200);

  // ---------- Headline decodes in: glyphs cycle, then lock, left to right ----------
  function decode(el) {
    if (still) return;
    var spans = el.querySelectorAll(".g"), GL = "▓▒░#%&@/\\<>01";
    spans.forEach(function (sp, wi) {
      var final = sp.getAttribute("data-text"), len = final.length, start = null, dur = 520 + wi * 140;
      sp.style.minWidth = sp.getBoundingClientRect().width + "px";
      function tick(ts) {
        if (!start) start = ts; var p = Math.min(1, (ts - start) / dur), done = Math.floor(p * len), out = "";
        for (var i = 0; i < len; i++) out += i < done || final[i] === " " ? final[i] : GL[Math.floor(Math.random() * GL.length)];
        sp.firstChild.nodeValue = out;
        if (p < 1) requestAnimationFrame(tick); else { sp.firstChild.nodeValue = final; sp.style.minWidth = ""; }
      }
      setTimeout(function () { requestAnimationFrame(tick); }, 120 + wi * 90);
    });
  }
  document.fonts && document.fonts.ready ? document.fonts.ready.then(function () { decode($("h1")); }) : decode($("h1"));
})();
</script>
</body>
</html>
